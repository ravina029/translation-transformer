[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "translation-transformer"
version = "0.1.0"
description = "Transformer-based machine translation project"
readme = "README.md"
requires-python = ">=3.10"

[tool.black]
target-version = ["py310"]
line-length = 88